// test - Edge/Cloud telemetry ingest schema.
//
// This .proto is the NORMATIVE definition of the wire format used by every
// transport in rpcbench. The Go encoder/decoder in internal/wire is a
// hand-written, byte-compatible implementation of this schema, so that the
// benchmark has no protoc/codegen build dependency. If you prefer generated
// stubs, run:
//
//   protoc --go_out=. --go_opt=paths=source_relative proto/telemetry.proto
//
// and the produced messages will be wire-identical to internal/wire.

syntax = "proto3";

package test.telemetry.v1;

option go_package = "github.com/MrCO0W/A-gRPC-over-QUIC-Multi-Stream/rpcbench/gen/telemetryv1;telemetryv1";

// A single normalized measurement produced by the Edge Gateway after it has
// converted a raw sensor reading (MQTT/CoAP) into a canonical unit.
message Measurement {
  string sensor_id   = 1;  // e.g. "temp-0007"
  string kind        = 2;  // e.g. "temperature" | "humidity" | "pm25"
  double value       = 3;  // normalized value
  string unit        = 4;  // SI unit after normalization, e.g. "degC"
  int64  ts_unix_ns  = 5;  // sensor sample time
  uint64 seq         = 6;  // per-stream monotonic sequence number
  bytes  payload     = 7;  // optional opaque padding (controls message size)
}

// A batch of measurements belonging to ONE logical stream (= one sensor kind).
// Each stream is carried on its own HTTP/2 stream, HTTP/3 stream, QUIC stream
// or TCP connection depending on the transport under test.
message Batch {
  string stream        = 1;  // logical stream key == Measurement.kind
  uint64 batch_seq     = 2;  // per-stream monotonic batch counter
  int64  sent_unix_ns  = 3;  // client-side send timestamp
  repeated Measurement items = 4;
}

// Server acknowledgement for exactly one Batch.
message Ack {
  string stream       = 1;
  uint64 batch_seq    = 2;
  int64  recv_unix_ns = 3;  // server-side arrival timestamp (one-way delay)
  int64  srv_unix_ns  = 4;  // server-side reply timestamp
  uint32 accepted     = 5;  // number of measurements accepted
}

// Logical service. Implemented over four transports:
//   rest  : HTTP/1.1 + TLS, JSON body, one TCP connection per stream
//   grpc  : gRPC wire protocol over HTTP/2 + TLS, N streams on ONE connection
//   h3    : gRPC wire protocol over HTTP/3 (QUIC), N streams on ONE connection
//   qtun  : gRPC framing directly on raw QUIC streams (no HTTP layer)
service Ingest {
  rpc StreamBatches(stream Batch) returns (stream Ack);
}
